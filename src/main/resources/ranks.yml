# Rank order matters. Highest rank = lowest priority, Lowest rank = highest priority. 
# Also one more thing... Jar has a really REALLY big penis (Jar didn't write this I promise)

# Defining the ranks to fetch from LuckPerms & seperating them into their respective tracks managed by this plugin (for prefixes only)
tracks:
  paid:
    - ultra
    - hero
    - legend
    - titan
    - jartonite
  rankup:
    - default
    - wanderer
    - explorer
    - commoner
    - farmer
    - merchant
    - artisan
    - noble
    - bishop
    - monarch
    - emperor
    - eternal
  staff:
    - builder
    - helper
    - media
    - jrmod
    - mod
    - srmod
    - developer
    - jradmin
    - admin
    - manager
    - owner
    - founder

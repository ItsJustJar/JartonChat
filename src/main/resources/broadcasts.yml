# Custom broadcasts configuration for /jcbc command
# Placeholders:
# %arg1%, %arg2%, etc. - Command arguments.
#
# Colors:
# You can define default colors here using standard Minecraft color codes (&c, &l, etc.)
# or hex codes (#RRGGBB).
#
# Message Placeholders:
# {main_color}, {secondary_color}, {text_color}, {bold}, {store_text}

purchase:
  enabled: true
  permission: "jcbc.broadcast"
  defaults:
    main_color: "#9eff00"
    secondary_color: "#c4ff00"
    text_color: "&f"
    bold: true
  store_url: "https://store.jarton.me"
  store_text: "store.jarton.me"
  sounds:
    - name: "BLOCK_NOTE_BLOCK_PLING"
      volume: 1.0
      pitch: 1.4
  messages:
    - ""
    - "                          {main_color}{bold}ᴘᴜʀᴄʜᴀsᴇ"
    - ""
    - "                {secondary_color}{bold}%arg1% {text_color}ʜᴀs ᴊᴜsᴛ ʙᴏᴜɢʜᴛ {secondary_color}{bold}%arg2%{text_color}! ɢɢs!"
    - "   {text_color}ɪꜰ ʏᴏᴜ ᴡɪsʜ ᴛᴏ sᴜᴘᴘᴏʀᴛ ᴜs ᴠɪsɪᴛ {secondary_color}&n{store_text}"
    - ""


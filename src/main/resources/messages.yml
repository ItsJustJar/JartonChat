clickable_name:
    enabled: true
    command: "/friend {player}"
    hover_text: "&eClick to manage friendship with &f{player}"

private-messages:
    format:
        sender: "&6&lME &e-> &e{recipient}&f: {message}"
        recipient: "&e{sender} &e-> &6&lME&f: {message}"
